<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referenzen – Anima Absoluta, Anett Szabó</title>
<meta name="description" content="Rückmeldungen von Menschen, die Anett Szabó in Körperarbeit, Yoga, Pilates und Meditation begleitet hat.">
<link rel="canonical" href="https://www.animaabsoluta.de/referenzen.html">
<meta name="robots" content="index, follow">
<style>
  :root {
    --bg: #F5F1E8;
    --text: #4F4A52;
    --muted: #7B7480;
    --primary: #A996B8;
    --secondary: #AEBDA3;
    --accent: #BFA06A;
    --border: #DDD4C8;
    --card: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.7; }
  a { color: inherit; text-decoration: none; }
  header { border-bottom: 1px solid var(--border); background: rgba(245,241,232,0.96); }
  .header-inner { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .header-inner img { height: 36px; width: auto; display: block; }
  .back { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .back:hover { color: var(--primary); }
  main { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem 5rem; }
  .section-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.8rem; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: normal; line-height: 1.3; margin-bottom: 1rem; }
  h1 em { font-style: italic; color: var(--primary); }
  .intro { font-size: 1rem; color: var(--muted); max-width: 600px; margin-bottom: 3rem; }

  .ref-grid { columns: 2 380px; column-gap: 1.5rem; }
  .ref-card { break-inside: avoid; background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 1.8rem; margin-bottom: 1.5rem; position: relative; }
  .ref-card::before { content: '„'; position: absolute; top: 0.4rem; left: 1.2rem; font-size: 3rem; line-height: 1; color: var(--primary); opacity: 0.45; }
  .ref-text { font-style: italic; color: var(--text); line-height: 1.8; padding-top: 1.2rem; white-space: pre-line; }
  .ref-von { margin-top: 1.1rem; padding-top: 0.9rem; border-top: 1px solid var(--border); font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; color: var(--muted); }
  .ref-von strong { display: block; font-weight: normal; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }

  .leer { background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 2rem; color: var(--muted); max-width: 600px; }

  .cta { margin-top: 3rem; text-align: center; }
  .btn-primary { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; background: var(--primary); color: #fff; padding: 14px 28px; border-radius: 2px; transition: background 0.2s; display: inline-block; }
  .btn-primary:hover { background: #967fa8; }

  footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem; text-align: center; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.78rem; color: var(--muted); }
  footer a { margin: 0 0.6rem; }
  footer a:hover { color: var(--primary); }

  @media (max-width: 768px) {
    main { padding: 3rem 1.25rem 4rem; }
    .header-inner { padding: 1rem 1.25rem; }
    .ref-grid { columns: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html"><img src="assets/logo.png" alt="Anima Absoluta – Anett Szabó"></a>
    <a href="index.html" class="back">← Zur Startseite</a>
  </div>
</header>

<main>
  <p class="section-label">Referenzen</p>
  <h1>Was Menschen <em>erlebt</em> haben</h1>
  <p class="intro">Rückmeldungen von Menschen, die ich in Kursen und in der Einzelbegleitung begleiten durfte.</p>

  <div id="refGrid" class="ref-grid" aria-live="polite"></div>
  <p id="refLeer" class="leer" hidden>Hier entstehen nach und nach Rückmeldungen von Menschen, die ich begleitet habe.</p>

  <div class="cta">
    <a href="index.html#kontakt" class="btn-primary">Schreib mir</a>
  </div>
</main>

<footer>
  <a href="index.html">Startseite</a>
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
</footer>

<script>
(async function () {
  const grid = document.getElementById('refGrid');
  const leer = document.getElementById('refLeer');
  let liste = [];
  try {
    const r = await fetch('data/referenzen.json', { cache: 'no-store' });
    if (r.ok) {
      const daten = await r.json();
      if (Array.isArray(daten)) liste = daten;
    }
  } catch (e) { /* ohne Daten erscheint der freundliche Hinweis */ }

  liste = liste.filter(function (x) { return x && typeof x.text === 'string' && x.text.trim() !== ''; });
  liste.sort(function (a, b) { return String(b.added || '').localeCompare(String(a.added || '')); });

  if (!liste.length) { leer.hidden = false; return; }

  liste.forEach(function (x) {
    const card = document.createElement('figure');
    card.className = 'ref-card';
    const text = document.createElement('blockquote');
    text.className = 'ref-text';
    text.textContent = x.text;
    const von = document.createElement('figcaption');
    von.className = 'ref-von';
    const name = document.createElement('strong');
    name.textContent = x.name || '';
    von.appendChild(name);
    if (x.context) von.appendChild(document.createTextNode(x.context));
    card.appendChild(text);
    card.appendChild(von);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
